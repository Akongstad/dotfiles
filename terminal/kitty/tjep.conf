include kitty.conf
font_size 13
remember_window_size no
initial_window_width 100c
initial_window_height 14c
hide_window_decorations yes
input_delay 0

# setsid -f kitty -c ~/.config/kitty/tjep.conf --single-instance --instance-group=tjep --start-as=hidden
symbol_map U+F0001-U+F1AF0 Symbols Nerd Font Mono
symbol_map U+EC82 Symbols Nerd Font Mono
symbol_map U+F0001-U+F1AF0,U+ED00-U+F2FF Symbols Nerd Font Mono
